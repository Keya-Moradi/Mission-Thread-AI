name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR cancels any still-running CI for that
# same ref, rather than letting superseded commits keep burning runner time
# — different branches/PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this workflow only reads the repository, never
# writes to it, opens PRs, or touches other GitHub resources.
permissions:
  contents: read

env:
  AI_MODE: mock
  # Deliberately non-secret — this only ever runs against the ephemeral
  # Postgres service container below, never a real deployment.
  AUTH_SECRET: "ci-only-secret-not-used-outside-this-workflow"
  DATABASE_URL: "postgresql://missionthread:ci_test_password@localhost:5432/missionthread_test"
  TEST_DATABASE_URL: "postgresql://missionthread:ci_test_password@localhost:5432/missionthread_test"
  # Deliberately NOT set at workflow level: ALLOW_DESTRUCTIVE_DATABASE_OPERATION
  # and MISSIONTHREAD_SEED_SCOPE are supplied only on the one step below that
  # actually needs them — see packages/core/src/db-safety.ts.

jobs:
  build:
    runs-on: ubuntu-latest
    # Bounded worst case: every step already has its own internal timeout
    # (the smoke test's 90s watchdog, the Docker runtime check's 30s
    # readiness poll, Playwright's own per-test timeout, ...), but a job
    # level ceiling guarantees this workflow can never silently occupy a
    # runner for GitHub's full default 6-hour maximum the way a past
    # process-handling bug once did — see docs/DECISIONS.md, "Phase 2
    # correction pass" (the smoke-test hang) — regardless of the cause.
    timeout-minutes: 30

    # A dedicated CI database, isolated to this job's ephemeral container —
    # never the developer's local dev/test database. host:port/database
    # exactly matches GITHUB_ACTIONS_TEST_TARGETS in
    # packages/core/src/db-safety.ts, which only matches when
    # GITHUB_ACTIONS=true — a variable GitHub Actions sets automatically for
    # every job (unlike the generic CI variable, which other tools also set
    # and so cannot uniquely identify this runner), so it's not set
    # explicitly here.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: missionthread
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: missionthread_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate --workspace @missionthread/core

      - name: Generate Prisma client
        run: npm run db:generate --workspace @missionthread/core

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      # A real gate, not informational-only: fails on any high/critical
      # advisory that isn't already in scripts/dependency-advisory-baseline.json
      # (see docs/DEPENDENCY_ADVISORIES.md for the full, reviewed
      # disposition of every currently accepted finding). Passing means "no
      # new, unreviewed high/critical regression" — never "zero
      # vulnerabilities." No `continue-on-error`.
      - name: Dependency vulnerability scan
        run: npm run check:audit

      - name: Migrate CI test database
        run: npm run db:migrate:deploy --workspace @missionthread/core

      - name: Seed CI test database
        run: npm run db:seed:github-actions:internal

      # Phase 2 added database-backed tests (packages/core/src/analysis) —
      # they need the CI database migrated and seeded first, which unit
      # tests alone previously didn't (see docs/DECISIONS.md).
      - name: Unit and integration tests
        run: npm run test

      # Built *before* tested: packages/mcp-server/src/built-stdio-protocol.test.ts
      # drives the real emitted dist/cli.js as a child process and fails
      # loudly (not silently skips) when GITHUB_ACTIONS=true and dist/cli.js
      # is missing — so a green CI run is real proof the built stdio server
      # was actually exercised, not just the in-memory McpServer object. See
      # docs/DECISIONS.md, "MCP build-before-test CI ordering."
      - name: Build MCP server
        run: npm run build --workspace @missionthread/mcp-server

      # Read-only against the same seeded CI database — never resets or
      # seeds it itself (packages/mcp-server/src/test/setup-env.ts validates
      # the target before Prisma is ever imported, same discipline as
      # packages/core's own test setup).
      - name: MCP server tests
        run: npm run test:mcp

      # Deterministic, offline, no database/network — see evals/README.md.
      # Proves pipeline and policy behavior, not general model quality; the
      # one live-provider run is a separate, manually authorized command
      # (see docs/EVAL_RESULTS.md), never run in CI.
      - name: Mock AI evaluation suite
        run: npm run eval:mock

      - name: Production build
        run: npm run build

      # AUTH_TRUST_HOST is scoped to this one step, not workflow-wide: only
      # the production server this step launches (via npm run smoke, which
      # spawns `next start` and inherits this step's environment) needs
      # Auth.js to trust the request host it sees in the GitHub Actions
      # runner — see docs/DECISIONS.md. Non-secret CI runtime setting, not
      # a credential.
      - name: Application smoke test
        env:
          AUTH_TRUST_HOST: "true"
        run: npm run smoke --workspace @missionthread/web

      # Only Chromium is installed (the one browser playwright.config.ts
      # drives) — no reason to pull Firefox/WebKit for a single happy-path
      # suite. `--with-deps` installs the runner's missing system libraries
      # apt-get style; without it, headless Chromium fails to launch on a
      # bare ubuntu-latest image.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Reuses the build from the "Production build" step above (the
      # workspace-level `test:e2e` script is bare `playwright test`, unlike
      # the root script, which also rebuilds — see package.json) and the
      # same seeded CI database the unit/integration tests already used;
      # e2e/decision-workflow.spec.ts restores every record it changes in a
      # try/finally, so running it after the Vitest suite (which cleans up
      # its own temporary fixtures) still starts from the deterministic seed
      # state. No separate reset step — see docs/DECISIONS.md, "Phase 5
      # correction: non-destructive Playwright command". AUTH_TRUST_HOST is
      # scoped here for the same reason as the smoke-test step above: the
      # real server Playwright's webServer launches needs it in this runner
      # environment specifically.
      - name: Playwright end-to-end test
        env:
          AUTH_TRUST_HOST: "true"
        run: npm run test:e2e --workspace @missionthread/web

      # No DATABASE_URL build arg is passed; the Dockerfile's own non-secret,
      # unreachable placeholder default is sufficient (`prisma generate`
      # never opens a connection at build time).
      - name: Docker build
        run: docker build -t missionthread-ai:ci .

      # Runtime verification, not just build verification: proves a
      # container from the image just built actually starts, serves the
      # real app, and authenticates against a real database — not only that
      # the Dockerfile compiles. --network host lets the container reach
      # this job's own Postgres service at localhost:5432 the same way every
      # other step in this job already does (GitHub Actions maps a service
      # container's ports onto the runner's own localhost), which is
      # simpler than joining a dedicated Docker network for one bounded
      # check. DATABASE_URL/AUTH_SECRET/AI_MODE are inherited from this
      # workflow's own top-level env: block via bare `-e NAME` (no `=value`)
      # rather than retyped, so this step can never drift from the exact
      # connection string every other step already uses — and stay supplied
      # only at container runtime, never baked into the image. No migrate or
      # seed command runs here: the database is already migrated and seeded
      # by the earlier steps in this same job, and this step only reads it.
      # The container is always removed via `trap ... EXIT`, including on a
      # failed check, so nothing lingers on the runner. See
      # docs/DECISIONS.md, "Docker Compose application service and CI
      # runtime verification."
      - name: Docker runtime smoke test
        env:
          AUTH_TRUST_HOST: "true"
        run: |
          set -euo pipefail
          CONTAINER_NAME="missionthread-ai-runtime-check-${{ github.run_id }}-${{ github.run_attempt }}"
          RUNTIME_PORT=3300

          cleanup() {
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$CONTAINER_NAME" \
            --network host \
            -e DATABASE_URL \
            -e AUTH_SECRET \
            -e AUTH_TRUST_HOST \
            -e AI_MODE \
            -e PORT="$RUNTIME_PORT" \
            missionthread-ai:ci

          echo "Waiting for the container to become ready (bounded, 30s max)..."
          ready=""
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null)" != "true" ]; then
              echo "Container exited before becoming ready:"
              docker logs "$CONTAINER_NAME" || true
              exit 1
            fi
            if curl -sf "http://localhost:${RUNTIME_PORT}/login" >/dev/null 2>&1; then
              ready="1"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "Container did not become ready within 30s:"
            docker logs "$CONTAINER_NAME" || true
            exit 1
          fi

          echo "Verifying the container runs as its intended non-root user..."
          RUNTIME_USER="$(docker exec "$CONTAINER_NAME" whoami)"
          echo "  running as: $RUNTIME_USER"
          if [ "$RUNTIME_USER" = "root" ]; then
            echo "FAIL: container is running as root, expected the non-root 'nextjs' user."
            exit 1
          fi

          echo "Verifying AI_MODE=mock inside the container..."
          RUNTIME_AI_MODE="$(docker exec "$CONTAINER_NAME" printenv AI_MODE)"
          if [ "$RUNTIME_AI_MODE" != "mock" ]; then
            echo "FAIL: AI_MODE inside the container is '$RUNTIME_AI_MODE', expected 'mock'."
            exit 1
          fi

          echo "Verifying OPENAI_API_KEY is not set inside the container..."
          if docker exec "$CONTAINER_NAME" printenv OPENAI_API_KEY >/dev/null 2>&1; then
            echo "FAIL: OPENAI_API_KEY is set inside the container."
            exit 1
          fi
          echo "  confirmed absent"

          echo "Running the authenticated, database-backed HTTP check..."
          DOCKER_RUNTIME_CHECK_BASE_URL="http://localhost:${RUNTIME_PORT}" \
            node apps/web/scripts/docker-runtime-check.mjs

          echo "Container logs (for this run's record only):"
          docker logs "$CONTAINER_NAME" || true
